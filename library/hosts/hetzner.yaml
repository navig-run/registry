default_app: portfolio

# Database root credentials (for host-level database management)
database:
  root_user: root
  root_password: "ENCRYPTED_ROOT_PASSWORD_HERE"

# Host metadata
metadata:
  description: "Hetzner VPS - Alternative hosting"
  location: "Finland"
  provider: "Hetzner"
  os: "Ubuntu 22.04"
  created_at: "2024-01-12T16:00:00Z"

