id: log-mood
name: Log Mood
version: "2.0.0"
description: Record current mood (1-10), energy level, and optional notes. Appends to the health metrics CSV.
category: health
platform: [windows, linux, macos]
formation: morning-routine
author: navig-run

parameters:
  - name: mood
    description: "Mood score 1-10 (1=terrible, 5=neutral, 10=excellent)"
    required: true
  - name: energy
    description: "Energy level 1-10"
    required: false
  - name: notes
    description: "Optional notes (triggers, context)"
    required: false

steps:
  - name: append-mood
    description: Append mood entry to spaces/health/metrics.csv
    env:
      NAVIG_PARAM_MOOD: "{{mood}}"
      NAVIG_PARAM_ENERGY: "{{energy}}"
      NAVIG_PARAM_NOTES: "{{notes}}"
    script: |
      import pathlib, datetime, csv, os, sys
      p = pathlib.Path("spaces/health/metrics.csv")
      p.parent.mkdir(parents=True, exist_ok=True)
      header = "date,weight_kg,body_fat_pct,resting_hr,sleep_hours,steps,mood_1_10,hrv,notes"
      if not p.exists():
          p.write_text(header + "\n", encoding="utf-8")
      today = datetime.date.today().isoformat()
      mood = os.environ.get("NAVIG_PARAM_MOOD", "").strip()
      energy = os.environ.get("NAVIG_PARAM_ENERGY", "").strip()
      notes = os.environ.get("NAVIG_PARAM_NOTES", "")
      if not mood:
          print("Not recorded: 'mood' is required (1-10).")
          sys.exit(1)
      note_parts = []
      if energy:
          note_parts.append(f"energy:{energy}")
      if notes:
          note_parts.append(notes)
      note_str = "; ".join(note_parts)
      # Columns: date,weight_kg,body_fat_pct,resting_hr,sleep_hours,steps,mood_1_10,hrv,notes
      row = [today, "", "", "", "", "", mood, "", note_str]
      with open(p, "a", encoding="utf-8", newline="") as f:
          csv.writer(f, lineterminator="\n").writerow(row)
      print(f"Mood logged: {mood}/10" + (f" (energy: {energy}/10)" if energy else "") + f" — {today}")
    script_windows: |
      $p = "spaces\health\metrics.csv"
      $dir = Split-Path $p
      if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
      $header = "date,weight_kg,body_fat_pct,resting_hr,sleep_hours,steps,mood_1_10,hrv,notes"
      if (-not (Test-Path $p)) { Set-Content -Path $p -Value $header }
      $today = (Get-Date).ToString("yyyy-MM-dd")
      $mood = "$env:NAVIG_PARAM_MOOD".Trim()
      $energy = "$env:NAVIG_PARAM_ENERGY".Trim()
      $notes = $env:NAVIG_PARAM_NOTES
      if (-not $mood) { Write-Host "Not recorded: 'mood' is required (1-10)."; exit 1 }
      function ConvertTo-CsvField([string]$v) {
          if ($v -match '[",\r\n]') { return '"' + $v.Replace('"', '""') + '"' }
          return $v
      }
      $noteParts = @()
      if ($energy) { $noteParts += "energy:$energy" }
      if ($notes) { $noteParts += $notes }
      $noteStr = $noteParts -join "; "
      # Columns: date,weight_kg,body_fat_pct,resting_hr,sleep_hours,steps,mood_1_10,hrv,notes
      $row = (@($today, "", "", "", "", "", $mood, "", $noteStr) | ForEach-Object { ConvertTo-CsvField $_ }) -join ","
      Add-Content -Path $p -Value $row
      Write-Host "Mood logged: $mood/10$(if ($energy) { " (energy: $energy/10)" }) — $today"
