space: iot-space
version: "1.0.0"

# Primary settings
# The space root is the folder that contains this .navig/ directory
# (installed spaces live under ~/.navig/spaces/<id>). Paths below are relative to it.
default_shell_windows: powershell
default_shell_linux: bash
default_shell_macos: zsh

# Network defaults — edit for your LAN
default_network_range: "192.168.1.0/24"
iot_vlan: 20
iot_subnet: "192.168.20.0/24"
discovery_methods: [mdns, ssdp, arp]
nmap_args: "-sn -T4"

# MQTT broker defaults — edit for your broker
mqtt_host: "192.168.1.10"
mqtt_port: 1883
mqtt_tls_port: 8883
mqtt_base_topic: "iot"

# Tools — leave empty to resolve from PATH (iot.mosquitto_bin = folder holding mosquitto_sub/pub)
mosquitto_bin: ""

# Home Assistant
ha_url: "http://192.168.1.10:8123"

# Paths
skills_dir: ".navig/skills/"
formations_dir: ".navig/store/formations/"
agents_dir: ".navig/store/agents/"
workflows_dir: ".navig/store/workflows/"
prompts_dir: ".navig/store/prompts/"
wiki_dir: ".navig/wiki/"
memory_dir: ".navig/memory/"

# Agent defaults
default_formation: discovery-sweep
escalation_agent: operator

# Logging
log_level: info
audit_log: ".navig/logs/audit.log"

# Pack / sharing
pack_format: "navig-space-pack"
pack_exclude:
  - ".navig/memory/secrets.json"
  - ".navig/logs/**"
  - ".env"
