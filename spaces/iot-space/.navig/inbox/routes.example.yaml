schema_version: "1.0"
space: iot
updated: "2026-07-10"
description: >
  Inbox routing configuration for the iot space.
  Messages arriving on each channel are dispatched to the owning agent.
  Unrouted messages escalate to the space lead.

# ─────────────────────────────────────────────
# Channel Routes
# ─────────────────────────────────────────────
routes:
  - channel: "#discovery"
    owner: beacon
    description: Device discovery, fingerprinting, mDNS/SSDP/ARP, Zigbee mesh, registry updates
    triggers:
      - keyword: ["discover", "scan", "device", "mdns", "ssdp", "arp", "fingerprint", "zigbee", "pair", "registry", "unknown device"]
      - formation: discovery-sweep
    response_mode: immediate
    notify_on: [new_device_detected, device_offline, unfingerprinted_device]

  - channel: "#mqtt"
    owner: broker
    description: MQTT broker health, topic mapping, publish/subscribe routing
    triggers:
      - keyword: ["mqtt", "topic", "publish", "subscribe", "broker", "mosquitto", "retained", "payload", "qos"]
      - formation: mqtt-ops
    response_mode: immediate
    notify_on: [broker_restart, stale_topic, new_unmapped_topic]

  - channel: "#security"
    owner: warden
    description: VLAN/subnet segmentation, default-credential & CVE audit, rogue device & intrusion watch
    triggers:
      - keyword: ["security", "vlan", "segmentation", "isolation", "credential", "default password", "cve", "rogue", "intrusion", "phone-home"]
      - formation: security-mesh
    response_mode: immediate
    notify_on: [segment_boundary_crossed, default_credentials_found, cve_match, rogue_device_detected]

  - channel: "#firmware"
    owner: flux
    description: Firmware version tracking, Tasmota/ESPHome flashing, staged OTA rollouts
    triggers:
      - keyword: ["firmware", "ota", "flash", "tasmota", "esphome", "update", "version", "drift", "rollback"]
      - formation: firmware-fleet
    response_mode: immediate
    notify_on: [version_drift_detected, ota_wave_complete, flash_failed, rollback_triggered]

  - channel: "#automation"
    owner: automa
    description: Scenes, schedules, triggers, Home Assistant entity sync
    triggers:
      - keyword: ["automation", "scene", "schedule", "trigger", "home assistant", "entity", "sync", "scenario"]
      - formation: automation-loop
    response_mode: immediate
    notify_on: [entity_out_of_sync, orphaned_entity, scene_dry_run_failed]

  - channel: "#telemetry"
    owner: sensor
    description: Energy/environment readings, battery, uptime, RSSI, offline detection
    triggers:
      - keyword: ["telemetry", "energy", "power", "battery", "temperature", "humidity", "rssi", "offline", "uptime", "reading"]
      - formation: discovery-sweep
    response_mode: scheduled
    schedule: "0 1 * * *"  # nightly at 01:00
    notify_on: [low_battery, device_offline, abnormal_reading]

  - channel: "#ops"
    owner: operator
    description: Workflow summaries and cross-agent reports addressed to the operator (morning sweep, onboarding)
    triggers:
      - keyword: ["summary", "report", "sweep", "onboarded"]
    response_mode: digest
    notify_on: [workflow_summary, onboarding_complete]

# ─────────────────────────────────────────────
# Escalation Rules
# ─────────────────────────────────────────────
escalation:
  unrouted_messages:
    action: escalate_to_space_lead
    space_lead: operator
    notify: true
    log: true

  no_owner_available:
    action: queue_and_notify
    max_queue_minutes: 60
    notify_operator: true

  critical_unacknowledged:
    severity: critical
    unacknowledged_minutes: 5
    action: escalate_to_operator
    notify: true

# ─────────────────────────────────────────────
# Global Notification Settings
# ─────────────────────────────────────────────
notifications:
  channels: ["desktop", "navig-inbox"]
  quiet_hours:
    start: "23:00"
    end: "07:00"
    override_for: ["critical"]
  log_all_to: ".navig/logs/inbox.log"
