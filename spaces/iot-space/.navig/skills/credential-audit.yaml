id: credential-audit
name: Credential Audit
version: "1.0.0"
description: Probe IoT device web UIs and services for default / factory credentials.
category: security
platform: [windows, linux, macos]
formation: security-mesh
author: navig-run

parameters:
  - name: target
    type: string
    description: "Device IP/host, or 'all' to sweep the registry"
    required: true
  - name: port
    type: int
    description: "HTTP port of the device admin UI"
    default: 80
  - name: wordlist
    type: string
    description: "Path to a user:pass default-credential list (one pair per line)"
    default: ".navig/memory/default-creds.txt"

steps:
  - id: reachable
    name: "Confirm device HTTP UI is reachable"
    shell: auto
    script: |
      curl -sf -o /dev/null "http://{{target}}:{{port}}/" && echo "reachable=true" || { echo "reachable=false"; exit 2; }

  - id: probe_defaults
    name: "Probe common default credentials via HTTP Basic auth"
    shell: auto
    script: |
      # NON-DESTRUCTIVE: read-only GET with each candidate pair; a 200/302 = accepted
      LIST="{{wordlist}}"
      [ -f "$LIST" ] || printf 'admin:admin\nadmin:password\nadmin:\nroot:root\nuser:user\n' > "$LIST"
      while IFS=: read -r u p; do
        code=$(curl -s -o /dev/null -w "%{http_code}" -u "$u:$p" "http://{{target}}:{{port}}/")
        if [ "$code" = "200" ] || [ "$code" = "302" ]; then
          echo "DEFAULT CREDENTIALS ACCEPTED  {{target}}  ${u}:${p}  (HTTP $code)"
        fi
      done < "$LIST"
      echo "credential-audit complete for {{target}}"
    script_windows: |
      $list = "{{wordlist}}"
      if (-not (Test-Path $list)) { "admin:admin","admin:password","admin:","root:root","user:user" | Set-Content $list }
      foreach ($pair in Get-Content $list) {
        $u,$p = $pair -split ':',2
        $sec = ConvertTo-SecureString ($p) -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential($u,$sec)
        try {
          $r = Invoke-WebRequest "http://{{target}}:{{port}}/" -Credential $cred -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
          if ($r.StatusCode -in 200,302) { Write-Output "DEFAULT CREDENTIALS ACCEPTED  {{target}}  ${u}:${p}" }
        } catch {}
      }

  - id: mqtt_anon
    name: "Check broker allows anonymous connections (common IoT misconfig)"
    shell: auto
    script: |
      mosquitto_sub -h {{config.mqtt_host}} -p {{config.mqtt_port}} -t '$SYS/broker/version' -C 1 -W 3 2>/dev/null \
        && echo "WARNING: broker accepted an ANONYMOUS connection" \
        || echo "OK: broker rejected anonymous connection (or unreachable)"

output:
  fields: [device, service, credential_pair, accepted, anonymous_mqtt]
  store_to: ".navig/memory/known-issues.json"
  merge: true

examples:
  - description: "Audit one device for default credentials"
    command: "navig skill run credential-audit --target 192.168.20.31"
  - description: "Sweep the whole registry"
    command: "navig skill run credential-audit --target all"
