id: generate-quote
name: Generate Quote
version: "1.0.0"
description: |
  Generate a professional quote/estimate with sequential PREFIX-YYYY-NNN numbering (prefix from finance.quotes.prefix).
  Includes validity period and acceptance terms.
category: finance
platform: [windows, linux, macos]
formation: revenue-pipeline
agent: controller
author: navig-run

parameters:
  - name: client_name
    description: Client company or individual name
    required: true
  - name: description
    description: Service description / scope of work
    required: true
  - name: amount
    description: Proposed amount (before tax)
    required: true
  - name: service_line
    description: Service category
    required: false
    default: general
  - name: validity_days
    description: Quote validity period in days
    required: false
    default: "30"
  - name: output_dir
    description: Directory to save quote
    required: false
    default: finance/quotes

outputs:
  - name: quote_file
    description: Path to generated quote markdown file
  - name: quote_number
    description: Assigned sequential quote number

steps:
  - name: generate-quote-file
    description: Determine next number, generate markdown quote, save to finance/quotes/
    env:
      NAVIG_PARAM_CLIENT_NAME: "{{ client_name }}"
      NAVIG_PARAM_AMOUNT: "{{ amount }}"
      NAVIG_PARAM_DESCRIPTION: "{{ description }}"
      NAVIG_PARAM_SERVICE_LINE: "{{ service_line }}"
      NAVIG_PARAM_VALIDITY_DAYS: "{{ validity_days }}"
      NAVIG_PARAM_OUTPUT_DIR: "{{ output_dir }}"
    script: |
      import datetime, os, pathlib, re

      def param(name, default=""):
          """A skill parameter; the runner passes it as NAVIG_PARAM_<NAME>."""
          return os.environ.get("NAVIG_PARAM_" + name.upper(), "").strip() or default

      def setting(path, env, default=""):
          """A company setting: env var first, then .navig/config.yaml. Unfilled placeholders count as unset."""
          value = os.environ.get(env, "")
          if not value:
              try:
                  import yaml
                  node = yaml.safe_load(pathlib.Path(".navig/config.yaml").read_text(encoding="utf-8")) or {}
                  for key in path.split("."):
                      node = node.get(key) if isinstance(node, dict) else None
                  value = "" if node is None else str(node)
              except Exception:
                  value = ""
          return default if not value or value.startswith("{") else value

      def next_number(folder, prefix, year, ext):
          """Next sequential number for PREFIX-YYYY-NNN files (no gaps, no reuse)."""
          nums = []
          for f in folder.glob(f"{prefix}-{year}-*{ext}"):
              m = re.fullmatch(re.escape(prefix) + r"-\d{4}-(\d{3})", f.stem)
              if m:
                  nums.append(int(m.group(1)))
          return max(nums, default=0) + 1

      company_name = setting("company.name", "COMPANY_NAME", "[Company name]")
      owner_name = setting("company.owner", "COMPANY_OWNER", "[Owner]")
      company_type = setting("company.type", "COMPANY_TYPE", "[Entity type]")
      company_id = setting("company.id", "COMPANY_ID", "[Company ID]")
      company_address = setting("company.address", "COMPANY_ADDRESS", "[Address]")
      company_email = setting("company.email", "COMPANY_EMAIL", "[Email]")
      CURRENCY = setting("finance.currency", "COMPANY_CURRENCY", "USD")
      tax_note = setting("finance.tax_exemption_note", "COMPANY_TAX_NOTE", "[Configure the tax rule for your jurisdiction]")

      client_name = param("client_name")
      amount = param("amount")
      description = param("description")
      service_line = param("service_line", "general")
      validity = int(param("validity_days") or setting("finance.quotes.validity_days", "COMPANY_QUOTE_VALIDITY_DAYS", "30"))
      PREFIX = setting("finance.quotes.prefix", "COMPANY_QUOTE_PREFIX", "QUO")

      output_dir = pathlib.Path(param("output_dir", "finance/quotes"))
      output_dir.mkdir(parents=True, exist_ok=True)

      today = datetime.date.today()
      quote_id = f"{PREFIX}-{today.year}-{next_number(output_dir, PREFIX, today.year, '.md'):03d}"
      valid_until = (today + datetime.timedelta(days=validity)).isoformat()

      content = f"""---
      quote_id: {quote_id}
      date: {today.isoformat()}
      valid_until: {valid_until}
      status: draft
      client: "{client_name}"
      amount: {amount}
      currency: {CURRENCY}
      service_line: {service_line}
      ---

      # QUOTE {quote_id}

      **From:**
      {company_name} — {owner_name}
      {company_type}
      ID: {company_id}
      {company_address}

      **To:**
      {client_name}

      ---

      ## Scope of Work

      {description}

      ---

      | Service | Amount |
      |---------|--------|
      | {description} | {amount} {CURRENCY} |

      ---

      **Total:** {amount} {CURRENCY}
      **Tax:** {tax_note}

      ---

      **Validity:** This quote is valid until {valid_until} ({validity} days).
      **Terms:** Payment due within 30 days of acceptance and project start.

      To accept, return signed with "Approved" notation.

      ---
      _Quote generated by NAVIG_
      """

      filepath = output_dir / f"{quote_id}.md"
      filepath.write_text(content, encoding="utf-8")
      print(f"Quote {quote_id} generated -> {filepath}")
