id: tax-summary
name: Tax Summary
version: "1.0.0"
description: |
  Generate a tax summary for declaration prep. Calculates quarterly revenue,
  tax contributions, threshold status, and revenue ceiling monitoring.
category: finance
platform: [windows, linux, macos]
formation: financial-review
agent: controller
author: navig-run

parameters:
  - name: quarter
    description: "Quarter: Q1-YYYY, Q2-YYYY, Q3-YYYY, Q4-YYYY"
    required: true
  - name: output_dir
    description: Directory to save tax summary
    required: false
    default: finance/tax

outputs:
  - name: summary_file
    description: Path to generated tax summary
  - name: tax_amount
    description: Tax contribution due for the quarter
  - name: ytd_revenue
    description: Year-to-date revenue

steps:
  - name: generate-tax-summary
    description: Calculate quarterly and YTD figures, tax, threshold status
    env:
      NAVIG_PARAM_QUARTER: "{{ quarter }}"
      NAVIG_PARAM_OUTPUT_DIR: "{{ output_dir }}"
    script: |
      import datetime, os, pathlib, re

      def param(name, default=""):
          """A skill parameter; the runner passes it as NAVIG_PARAM_<NAME>."""
          return os.environ.get("NAVIG_PARAM_" + name.upper(), "").strip() or default

      def setting(path, env, default=""):
          """A company setting: env var first, then .navig/config.yaml. Unfilled placeholders count as unset."""
          value = os.environ.get(env, "")
          if not value:
              try:
                  import yaml
                  node = yaml.safe_load(pathlib.Path(".navig/config.yaml").read_text(encoding="utf-8")) or {}
                  for key in path.split("."):
                      node = node.get(key) if isinstance(node, dict) else None
                  value = "" if node is None else str(node)
              except Exception:
                  value = ""
          return default if not value or value.startswith("{") else value

      PREFIX = setting("finance.invoicing.prefix", "COMPANY_INVOICE_PREFIX", "INV")
      CURRENCY = setting("finance.currency", "COMPANY_CURRENCY", "USD")
      TAX_RATE = float(setting("finance.tax_rate", "COMPANY_TAX_RATE", "0"))
      THRESHOLD_1 = float(setting("finance.tax_threshold", "COMPANY_TAX_THRESHOLD", "0"))
      THRESHOLD_2 = float(setting("finance.revenue_ceiling", "COMPANY_REVENUE_CEILING", "0"))

      invoices_dir = pathlib.Path("finance/invoices")
      output_dir = pathlib.Path(param("output_dir", "finance/tax"))
      output_dir.mkdir(parents=True, exist_ok=True)

      quarter = param("quarter").upper()  # e.g. Q1-2026
      m = re.fullmatch(r"Q([1-4])-(\d{4})", quarter)
      if not m:
          print(f"Invalid quarter '{quarter}' — use Q1-YYYY … Q4-YYYY")
          raise SystemExit(1)
      q_num = int(m.group(1))
      year = int(m.group(2))
      today = datetime.date.today().isoformat()

      q_months = {
          1: ["01", "02", "03"],
          2: ["04", "05", "06"],
          3: ["07", "08", "09"],
          4: ["10", "11", "12"],
      }

      months = q_months[q_num]
      q_total = 0.0
      ytd_total = 0.0
      monthly = {mm: 0.0 for mm in months}

      for f in sorted(invoices_dir.glob(f"{PREFIX}-{year}-*.md")):
          content = f.read_text(encoding="utf-8")
          amount_match = re.search(r"^amount(?:_ht)?:\s*([\d.]+)", content, re.M)
          date_match = re.search(r"^date:\s*(\d{4})-(\d{2})", content, re.M)
          if not amount_match or not date_match:
              continue

          amount = float(amount_match.group(1))
          inv_month = date_match.group(2)
          if int(inv_month) <= int(months[-1]):
              ytd_total += amount

          if inv_month in months:
              q_total += amount
              monthly[inv_month] = monthly.get(inv_month, 0) + amount

      tax_q = q_total * TAX_RATE
      tax_ytd = ytd_total * TAX_RATE
      threshold_1_pct = (ytd_total / THRESHOLD_1) * 100 if THRESHOLD_1 > 0 else 0
      threshold_2_pct = (ytd_total / THRESHOLD_2) * 100 if THRESHOLD_2 > 0 else 0

      summary = f"""# Tax Summary — {quarter}
      Generated: {today}

      ## Quarterly Revenue
      | Month | Revenue |
      |-------|---------|
      """
      for mm in months:
          summary += f"| {year}-{mm} | {monthly[mm]:,.2f} {CURRENCY} |\n"

      summary += f"""
      **Quarter Total:** {q_total:,.2f} {CURRENCY}

      ## Tax Declaration
      - **Quarter Revenue:** {q_total:,.2f} {CURRENCY}
      - **Tax Rate:** {TAX_RATE*100:.1f}%
      - **Tax Due:** {tax_q:,.2f} {CURRENCY}

      ## Year-to-Date Status
      - **YTD Revenue:** {ytd_total:,.2f} {CURRENCY}
      - **YTD Tax Paid/Due:** {tax_ytd:,.2f} {CURRENCY}
      - **Threshold 1:** {threshold_1_pct:.1f}% of {THRESHOLD_1:,.0f} {CURRENCY}
      - **Threshold 2:** {threshold_2_pct:.1f}% of {THRESHOLD_2:,.0f} {CURRENCY}
      """

      if threshold_1_pct > 80:
          summary += f"\nALERT: Revenue at {threshold_1_pct:.1f}% of threshold 1. Monitor closely.\n"
      if threshold_2_pct > 80:
          summary += f"\nALERT: Revenue at {threshold_2_pct:.1f}% of threshold 2. Risk of status change.\n"

      summary += """
      ## Reminders
      - Verify all invoices are accounted for before declaration
      - Keep all financial records per retention policy
      - Monitor thresholds monthly to avoid surprises
      """

      filepath = output_dir / f"tax-summary-{quarter}.md"
      filepath.write_text(summary, encoding="utf-8")
      print(f"Tax summary -> {filepath}")
      print(f"   {quarter}: {q_total:,.2f} {CURRENCY} | Tax due: {tax_q:,.2f} {CURRENCY}")
      print(f"   YTD: {ytd_total:,.2f} {CURRENCY} | T1: {threshold_1_pct:.1f}% | T2: {threshold_2_pct:.1f}%")
