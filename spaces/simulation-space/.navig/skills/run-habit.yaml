id: run-habit
name: Run Habit
version: "1.0.0"
description: >
  Log a habit execution attempt. Records whether the habit ran, the outcome,
  and any notes. Computes and displays the current streak.
category: habit-tracking
platform: [windows, linux, macos]
formation: habit-sim
author: simulation-space

parameters:
  - name: habit
    type: string
    required: true
    description: "Habit name or ID"
  - name: status
    type: enum
    values: [completed, missed, partial]
    required: true
  - name: notes
    type: string
    required: false
    default: ""
    description: "Notes on execution or failure condition"
  - name: date
    type: string
    required: false
    default: ""
    description: "Run date YYYY-MM-DD (defaults to today)"

steps:
  - id: log_habit_run
    name: "Log Habit Run"
    shell: auto
    env:
      NAVIG_PARAM_HABIT: "{{params.habit}}"
      NAVIG_PARAM_STATUS: "{{params.status}}"
      NAVIG_PARAM_NOTES: "{{params.notes}}"
      NAVIG_PARAM_DATE: "{{params.date}}"
    script: |
      python3 - <<'EOF'
      import json, os
      from datetime import datetime, date

      habits_path = ".navig/memory/habits.json"
      habit_name = os.environ.get("NAVIG_PARAM_HABIT", "")
      habit_filter = habit_name.lower()
      run_status = os.environ.get("NAVIG_PARAM_STATUS", "")
      notes = os.environ.get("NAVIG_PARAM_NOTES", "")
      run_date_str = os.environ.get("NAVIG_PARAM_DATE", "")
      run_date = run_date_str if run_date_str else date.today().isoformat()

      try:
          with open(habits_path, encoding="utf-8") as f:
              data = json.load(f)
      except Exception:
          data = {"habits": []}

      # Find or create habit
      habit = next((h for h in data.get("habits", []) if h.get("id", "").lower() == habit_filter or h.get("name", "").lower() == habit_filter), None)
      if not habit:
          habit = {"id": f"hab_{len(data['habits']) + 1:03d}", "name": habit_name, "runs": [], "current_streak": 0, "longest_streak": 0}
          data["habits"].append(habit)

      run = {"date": run_date, "status": run_status, "notes": notes, "logged_at": datetime.utcnow().isoformat() + "Z"}
      habit.setdefault("runs", []).append(run)

      # Recompute streak
      completed_runs = sorted([r for r in habit["runs"] if r["status"] == "completed"], key=lambda r: r["date"], reverse=True)
      streak = 0
      prev_date = None
      for r in completed_runs:
          d = date.fromisoformat(r["date"])
          if prev_date is None:
              streak = 1
              prev_date = d
          elif (prev_date - d).days == 1:
              streak += 1
              prev_date = d
          else:
              break
      habit["current_streak"] = streak
      habit["longest_streak"] = max(habit.get("longest_streak", 0), streak)

      os.makedirs(os.path.dirname(habits_path), exist_ok=True)
      with open(habits_path, "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2, ensure_ascii=False)

      miss_flag = " ⚠️" if run_status == "missed" else ""
      streak_info = f"streak: {streak}"
      print(f"Habit [{habit['id']}] '{habit['name']}' — {run_date}: {run_status}{miss_flag} | {streak_info}")
      EOF
    on_error: fail

outputs:
  - name: result
    from: log_habit_run
