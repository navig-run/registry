id: calculate-rate
name: Calculate Rate
version: "1.0.0"
description: >
  Calculate the effective hourly rate for a client or globally for a given
  period by dividing total billed amount by total billable hours.
  Compares against target rate and surfaces the gap.
category: analytics
platform: [windows, linux, macos]
formation: project-scope
author: freelance-space

parameters:
  - name: client
    type: string
    required: false
    default: "all"
    description: "Client ID/name, or 'all' for global effective rate"
  - name: period
    type: string
    required: false
    default: "this-month"
    description: "Period in YYYY-MM or YYYY-Q1/Q2/Q3/Q4, or 'this-month'"

steps:
  - id: compute_rate
    name: "Compute Effective Rate"
    shell: auto
    env:
      NAVIG_PARAM_CLIENT: "{{params.client}}"
      NAVIG_PARAM_PERIOD: "{{params.period}}"
    script: |
      python3 - <<'EOF'
      import json, os
      from datetime import date

      client_filter = os.environ.get("NAVIG_PARAM_CLIENT", "").lower()
      period = os.environ.get("NAVIG_PARAM_PERIOD", "")
      if period == "this-month":
          period = date.today().strftime("%Y-%m")

      time_path = ".navig/memory/time-log.json"
      inv_path = ".navig/memory/invoices.json"
      rates_path = ".navig/memory/rates.json"

      try:
          with open(time_path, encoding="utf-8") as f: time_data = json.load(f)
      except Exception: time_data = {"entries": []}
      try:
          with open(inv_path, encoding="utf-8") as f: inv_data = json.load(f)
      except Exception: inv_data = {"invoices": []}
      try:
          with open(rates_path, encoding="utf-8") as f: rates_data = json.load(f)
      except Exception: rates_data = {"target_rate": 0.0, "clients": {}}

      entries = [e for e in time_data.get("entries", [])
                 if e.get("billable") and e.get("date", "").startswith(period)]
      if client_filter != "all":
          entries = [e for e in entries if e.get("client", "").lower() == client_filter]

      invoices = [i for i in inv_data.get("invoices", [])
                  if i.get("period", "").startswith(period) and i.get("status") in ("sent", "paid")]
      if client_filter != "all":
          invoices = [i for i in invoices if i.get("client", "").lower() == client_filter]

      total_hours = sum(e.get("hours", 0) for e in entries)
      total_billed = sum(i.get("total", 0) for i in invoices)
      effective_rate = round(total_billed / total_hours, 2) if total_hours > 0 else 0.0
      target_rate = rates_data.get("target_rate", 0.0)
      gap = round(effective_rate - target_rate, 2) if target_rate > 0 else None

      scope = f"client '{client_filter}'" if client_filter != "all" else "all clients"
      print(f"Rate analysis — {scope} — period: {period}\n")
      print(f"  Billable hours : {total_hours:.2f}h")
      print(f"  Total billed   : {total_billed:,.2f}")
      print(f"  Effective rate : {effective_rate:,.2f}/h")
      if target_rate > 0:
          status = "✅ above target" if gap >= 0 else "⚠️ below target"
          print(f"  Target rate    : {target_rate:,.2f}/h")
          print(f"  Gap            : {gap:+.2f}/h {status}")
      else:
          print("  Target rate    : not set (add to rates.json)")
      EOF
    on_error: fail

outputs:
  - name: rate_analysis
    from: compute_rate
